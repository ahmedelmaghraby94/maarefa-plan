name: Apply evidence count to status modal
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-evidence-count.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch status-program modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '''const rows=list.map((x,i)=>`<tr><td>${i+1}</td><td>${canEditFromCard?`<button class="outline" style="border:0;padding:3px 0;color:#2563eb;font-weight:700;cursor:pointer" onclick="openProgramFromCard(${x.id})">${esc(x.name||"")}</button>`:esc(x.name||"")}</td><td>${esc(timingLabel(x)||"-")}</td><td>${esc(x.execution_date||"—")}</td><td>${esc(x.owner||"-")}</td><td>${badge(x.status)}</td><td>${progressValue(x)}%</td></tr>`).join("");'''
          new = '''const rows=list.map((x,i)=>`<tr><td>${i+1}</td><td>${canEditFromCard?`<button class="outline" style="border:0;padding:3px 0;color:#2563eb;font-weight:700;cursor:pointer" onclick="openProgramFromCard(${x.id})">${esc(x.name||"")}</button>`:esc(x.name||"")}</td><td>${esc(timingLabel(x)||"-")}</td><td>${esc(x.execution_date||"—")}</td><td>${esc(x.owner||"-")}</td><td>${badge(x.status)}</td><td>${progressValue(x)}%</td><td>${Number(x.evidence?.[0]?.count)||0}</td></tr>`).join("");'''
          if old not in s: raise SystemExit("target row code not found")
          s = s.replace(old, new, 1)
          oldh = '<th>#</th><th>البرنامج</th><th>موعد التنفيذ</th><th>التاريخ</th><th>المنفذ</th><th>الحالة</th><th>الإنجاز</th></tr></thead>'
          newh = '<th>#</th><th>البرنامج</th><th>موعد التنفيذ</th><th>التاريخ</th><th>المنفذ</th><th>الحالة</th><th>الإنجاز</th><th>الشواهد</th></tr></thead>'
          if oldh not in s: raise SystemExit("target header not found")
          s = s.replace(oldh, newh, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "عرض عدد الشواهد في قوائم البرامج"
          rm .github/workflows/patch-evidence-count.yml
          git add .github/workflows/patch-evidence-count.yml
          git commit -m "إزالة مهمة التعديل المؤقتة"
          git push
